<!doctype html>
<html>
	<body>
		<script type="module">
			import { PWBHost } from "../src/PWBHost.ts";
			const worker = new SharedWorker("./worker-host-error-outside-response.js", {
				type: "module",
			});
			const promiseWorker = new PWBHost(worker);
			promiseWorker.addEventListener("error", (event) => {
				window.testClient.error = event.error;
			});

			window.testClient = {
				error: undefined,
			};
		</script>
	</body>
</html>
